[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "satsa"
version = "0.1.0"
description = "SAT-SA: Supervisory Analytics Tool for SOC Assessment (SIH 2026, PS 26157, NTRO/NCIIPC)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pandas>=2.2,<3",
  "polars>=1.5,<2",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "shap>=0.46",
  "pyyaml>=6",
  "jinja2>=3.1",
  "joblib>=1.4",
  "typer>=0.12",
  "python-ulid>=2.7",
  "faker>=26",
  "python-multipart>=0.0.9",
  "reportlab>=4.2",
]

[project.optional-dependencies]
# The standalone `hdbscan` package gives GLOSH outlier scores and approximate_predict.
# It needs a C compiler; when it is absent the code falls back to sklearn.cluster.HDBSCAN.
hdbscan = ["hdbscan>=0.8.38"]
# weasyprint renders nicer PDFs but needs cairo/pango system libraries; reportlab is the default backend.
pdf = ["weasyprint>=62"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.scripts]
satsa = "satsa.cli:app"

[tool.setuptools.packages.find]
include = ["satsa*", "simulator*", "validation*"]

[tool.setuptools.package-data]
satsa = ["db/*.sql", "reports/templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
